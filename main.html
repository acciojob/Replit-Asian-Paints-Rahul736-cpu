<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Asian Paints</title>
    <style>
        #grid-container {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 10px;
        }
        .grid-item {
            width: 100px;
            height: 100px;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="grid-container">
        <div class="grid-item" id="1">1</div>
        <div class="grid-item" id="2">2</div>
        <div class="grid-item" id="3">3</div>
        <div class="grid-item" id="4">4</div>
        <div class="grid-item" id="5">5</div>
        <div class="grid-item" id="6">6</div>
        <div class="grid-item" id="7">7</div>
        <div class="grid-item" id="8">8</div>
        <div class="grid-item" id="9">9</div>
    </div>

    <br>

    <input id="block_id" placeholder="block id" />
    <input id="colour_id" placeholder="color" />

    <button id="change_button" onclick="changeColor()">Change color</button>
    <button id="Reset" onclick="resetColor()">Reset</button>

    <script>
        function resetColor() {
            for (let i = 1; i <= 9; i++) {
                document.getElementById(i).style.backgroundColor = "transparent";
            }
        }

        function changeColor() {
            let block = document.getElementById("block_id").value;
            let color = document.getElementById("colour_id").value;

            resetColor();

            if (block >= 1 && block <= 9) {
                document.getElementById(block).style.backgroundColor = color;
            }
        }
    </script>

</body>
</html>
