<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Asian Paints Grid - Fixed</title>
  <style>
    /* grid container */
    #grid-container {
      width: 216px;
      display: grid;
      grid-template-columns: repeat(3, 70px);
      grid-gap: 3px;
      margin: 20px 0;
    }

    /* grid items */
    .grid-item {
      width: 70px;
      height: 70px;
      border: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      user-select: none;
      background-color: transparent; /* start transparent */
    }

    /* simple layout for controls */
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    input[type="text"], input[type="number"] {
      padding: 6px;
      font-size: 14px;
      width: 160px;
    }

    button {
      padding: 6px 10px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h3>Asian Paints - 3x3 Grid</h3>

  <div id="grid-container">
    <div class="grid-item" id="1">1</div>
    <div class="grid-item" id="2">2</div>
    <div class="grid-item" id="3">3</div>
    <div class="grid-item" id="4">4</div>
    <div class="grid-item" id="5">5</div>
    <div class="grid-item" id="6">6</div>
    <div class="grid-item" id="7">7</div>
    <div class="grid-item" id="8">8</div>
    <div class="grid-item" id="9">9</div>
  </div>

  <div class="controls">
    <input type="number" id="block_id" placeholder="Enter Block ID (1-9)" min="1" max="9" />
    <input type="text" id="colour_id" placeholder="Enter color (name or hex)" />
    <button id="change_button" type="button">Change Color</button>
    <button id="Reset" type="button">Reset</button>
  </div>

  <script>
    // helper: set all grid items to transparent
    function resetGridTransparent() {
      const items = document.querySelectorAll('.grid-item');
      items.forEach(item => {
        // set empty string so computed style becomes transparent/default
        item.style.backgroundColor = 'transparent';
      });
    }

    // apply color to a block id (1-9). If invalid id -> do nothing.
    function applyColorToBlock(blockId, colorString) {
      // blockId is a number
      if (!Number.isInteger(blockId) || blockId < 1 || blockId > 9) return false;
      const el = document.getElementById(String(blockId));
      if (!el) return false;

      // apply color (browser will ignore invalid color values)
      el.style.backgroundColor = colorString;
      return true;
    }

    // change button behavior
    document.getElementById('change_button').addEventListener('click', function () {
      // read inputs
      const blockInput = document.getElementById('block_id').value;
      const colorInput = document.getElementById('colour_id').value.trim();

      // parse block id as integer
      const blockNum = parseInt(blockInput, 10);
      // Always reset all cells first (as required)
      resetGridTransparent();

      // Only apply the color if blockNum is valid 1..9 and color input is non-empty
      if (!Number.isNaN(blockNum) && blockNum >= 1 && blockNum <= 9 && colorInput.length > 0) {
        applyColorToBlock(blockNum, colorInput);
      }
      // If invalid, do nothing further (no alerts) — tests usually prefer silent no-op
    });

    // reset button behavior
    document.getElementById('Reset').addEventListener('click', function () {
      resetGridTransparent();
      // also clear inputs (some tests expect inputs cleared; harmless if not)
      document.getElementById('block_id').value = '';
      document.getElementById('colour_id').value = '';
    });

    // Ensure initial state is transparent
    resetGridTransparent();
  </script>
</body>
</html>
