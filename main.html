<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replit Asian Paints</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Asian Paints - 3x3 Grid</h2>

  <div id="grid-container">
    <div id="grid-item" data-id="1">1</div>
    <div id="grid-item" data-id="2">2</div>
    <div id="grid-item" data-id="3">3</div>
    <div id="grid-item" data-id="4">4</div>
    <div id="grid-item" data-id="5">5</div>
    <div id="grid-item" data-id="6">6</div>
    <div id="grid-item" data-id="7">7</div>
    <div id="grid-item" data-id="8">8</div>
    <div id="grid-item" data-id="9">9</div>
  </div>

  <input type="number" id="block_id" placeholder="Enter Block ID (1-9)">
  <input type="text" id="colour_id" placeholder="Enter Color (name or hex)">

  <button id="change_button" type="button">Change Color</button>
  <button id="Reset" type="button">Reset</button>

  <script src="script.js"></script>
</body>
</html>
